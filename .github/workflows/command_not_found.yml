name: Command Not Found Rebuild

on:
  schedule:
    - cron: "0 4 * * 0" # Runs at 04:00am UTC every Sunday
  workflow_dispatch:

permissions: {} # none

jobs:
  rebuild-command-not-found:
    permissions:
      issues: write
      contents: write
    if: github.repository == 'Apex-Studio-Dev/termux-packages'
    runs-on: ubuntu-slim
    steps:
      - name: Clone repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          # A PAT is required instead of the default GITHUB_TOKEN: pushes made
          # with GITHUB_TOKEN do not trigger other workflows, so the Packages
          # build+publish would never start. Create a classic PAT (repo scope)
          # as the APEXBOT_TOKEN repository secret.
          token: ${{ secrets.APEXBOT_TOKEN }}
      - name: Revbump main/command-not-found
        env:
          GITHUB_TOKEN: ${{ secrets.APEXBOT_TOKEN }}
        run: |
          git config --global user.name "ApexStudio Github Actions"
          git config --global user.email "actions@apexstudio.dev"

          ./scripts/bin/revbump command-not-found
          git add .
          git commit -m "rebuild(main/command-not-found): to update database"
          git push
